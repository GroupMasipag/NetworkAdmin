<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #121212; color: white; margin: 0; padding: 20px; }
        h1 { color: #ff4444; text-align: center; }
        
        /* Flex container makes items sit side-by-side on PC and stack on Mobile */
        .main-layout {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            flex: 1; /* Allows boxes to grow */
            min-width: 300px; /* Prevents boxes from getting too small */
            max-width: 600px;
        }

        /* Responsive Camera */
        .camera-box { border: 2px solid #ff4444; border-radius: 8px; overflow: hidden; background: #000; }
        video { width: 100%; height: auto; display: block; }

        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #333; }
        th { color: #888; text-transform: uppercase; }
        .timestamp { color: #0088ff; }
    </style>
</head>
<body>

    <h1>NETWORK MONITORING SYSTEM</h1>

    <div class="main-layout">
        <!-- Live Video Feed -->
        <div class="card">
            <h3>Live Monitoring Feed</h3>
            <div class="camera-box">
                <video id="webcam-feed" autoplay playsinline></video>
            </div>
        </div>

        <!-- Access Logs (Python Injected) -->
        <div class="card">
            <h3>Recent Access Logs</h3>
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>IP</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody>
                    {% for log in usage %}
                    <tr>
                        <td><strong>{{ log.username }}</strong></td>
                        <td>{{ log.user_ip }}</td>
                        <td class="timestamp">{{ log.access_time.strftime('%H:%M:%S') }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // JS is strictly used for Hardware (Webcam) access
        const videoElement = document.getElementById('webcam-feed');
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { videoElement.srcObject = stream; })
            .catch(err => { console.error("Camera access denied", err); });
    </script>

</body>
</html>
